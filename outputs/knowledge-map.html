<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Book · Victoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;400;600;700&family=Roboto+Condensed:wght@100;200;300&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   FIVE7 DESIGN TOKENS
   bg #000000 · text #FFFFFF · body #FFFFFFCF · muted #FFFFFFA6
   border #FFFFFF30 · divider #FFFFFF · hover invert
   Roboto 600 headings · Roboto Condensed 100-200 body
   Flat · no shadows · no gradients · no accent (except RED cross-links)
   ═══════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #000000;
  --bg-nav:    #151515;
  --text:      #FFFFFF;
  --body:      #FFFFFFCF;
  --muted:     #FFFFFFA6;
  --dim:       #FFFFFF60;
  --faint:     #FFFFFF30;
  --border:    #FFFFFF30;
  --hover-bg:  #FFFFFF;
  --hover-txt: #000000;
  --red:       #dc2626;
  --font-head: 'Roboto', sans-serif;
  --font-body: 'Roboto Condensed', sans-serif;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-head);
  overflow: hidden;
}

/* ── LAYOUT ─────────────────────────────────────────────── */
#app   { display: flex; width: 100vw; height: 100vh; position: relative; }
#graph { flex: 1; position: relative; overflow: hidden; }
#graph svg { width: 100%; height: 100%; display: block; cursor: grab; }
#graph svg:active { cursor: grabbing; }

/* ── TOOLBAR ─────────────────────────────────────────────── */
#toolbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  height: 44px; padding: 0 12px;
}
.hdiv { width: 1px; height: 20px; background: var(--border); margin: 0 10px; flex-shrink: 0; }

/* search */
#srch-wrap { position: relative; flex: 0 0 auto; }
#srch {
  background: transparent; border: 1px solid var(--border);
  border-radius: 2px; color: var(--text);
  font-family: var(--font-body); font-weight: 200; font-size: 12px;
  padding: 4px 10px; width: 190px; outline: none; letter-spacing: .04em;
}
#srch::placeholder { color: var(--dim); }
#srch:focus { border-color: var(--text); }

#sr-drop {
  display: none; position: absolute; top: 100%; left: 0;
  width: 320px; background: var(--bg-nav);
  border: 1px solid var(--border); border-top: none;
  z-index: 100; max-height: 280px; overflow-y: auto;
}
#sr-drop.open { display: block; }
.sri {
  display: flex; align-items: baseline; gap: 8px;
  padding: 7px 12px; cursor: pointer;
  border-bottom: 1px solid var(--border); font-size: 11px;
}
.sri:hover { background: var(--hover-bg); color: var(--hover-txt); }
.sri-badge { font-size: 8px; font-weight: 700; letter-spacing: .05em; flex-shrink: 0; }
.sri-name  { font-weight: 600; flex: 1; }
.sri-path  { font-size: 9px; color: var(--dim); font-family: var(--font-body); font-weight: 200; }

/* buttons */
.mbtn, .fbtn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-family: var(--font-head);
  font-size: 10px; font-weight: 600; letter-spacing: .08em;
  padding: 3px 9px; cursor: pointer; border-radius: 2px;
}
.mbtn.on, .fbtn.on { background: var(--hover-bg); color: var(--hover-txt); border-color: var(--hover-bg); }
.mbtn:hover:not(.on), .fbtn:hover:not(.on) { border-color: var(--text); color: var(--text); }

.zbtn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-size: 14px; width: 26px; height: 26px;
  cursor: pointer; border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
}
.zbtn:hover { background: var(--hover-bg); color: var(--hover-txt); border-color: var(--hover-bg); }

#idx-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-family: var(--font-head);
  font-size: 10px; font-weight: 600; letter-spacing: .08em;
  padding: 3px 10px; cursor: pointer; border-radius: 2px;
}
#idx-btn.on { background: var(--hover-bg); color: var(--hover-txt); border-color: var(--hover-bg); }
#idx-btn:hover:not(.on) { border-color: var(--text); color: var(--text); }

/* hint */
#hint {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: transparent; border: 1px solid var(--border);
  color: var(--dim); font-size: 10px; font-weight: 200;
  font-family: var(--font-body); letter-spacing: .06em;
  padding: 5px 14px; border-radius: 2px; pointer-events: none;
  transition: opacity .6s; z-index: 5;
}
#hint.gone { opacity: 0; }

/* ── INDEX PANEL (left) ──────────────────────────────────── */
#idx-panel {
  position: absolute; top: 44px; left: 0; bottom: 0;
  width: 230px; background: var(--bg-nav);
  border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 15;
  transform: translateX(-100%); transition: transform .22s ease;
}
#idx-panel.open { transform: translateX(0); }
#idx-list { padding: 8px 0; }
.idx-item {
  padding: 10px 14px; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.idx-item:hover { background: var(--hover-bg); color: var(--hover-txt); }
.idx-item.active { background: var(--faint); }
.idx-item-title { font-size: 11px; font-weight: 600; color: var(--body); margin-bottom: 4px; }
.idx-item-meta  { display: flex; gap: 4px; }

/* ── RIGHT PANEL ─────────────────────────────────────────── */
#panel {
  position: absolute; top: 44px; right: 0; bottom: 0;
  width: 280px; background: var(--bg-nav);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s ease;
  z-index: 15;
}
#panel.open { transform: translateX(0); }
#panel-head {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#ppath  { font-size: 9px; font-weight: 600; letter-spacing: .1em; color: var(--dim); margin-bottom: 5px; }
#ptitle { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; }
#pbody  { flex: 1; overflow-y: auto; padding: 10px 14px; }
#sugbtn {
  flex-shrink: 0; padding: 10px 14px;
  border-top: 1px solid var(--border); background: transparent;
  color: var(--dim); font-family: var(--font-head);
  font-size: 10px; font-weight: 600; letter-spacing: .07em;
  cursor: pointer; text-align: left; width: 100%; border-left: none; border-right: none; border-bottom: none;
}
#sugbtn:hover { background: var(--hover-bg); color: var(--hover-txt); }

/* ── PANEL CONTENT ───────────────────────────────────────── */
.lbadge {
  display: inline-block; font-size: 8px; font-weight: 700;
  letter-spacing: .06em; padding: 2px 6px; border-radius: 2px;
  vertical-align: middle;
}
.badge-tp   { background: var(--text); color: var(--bg); }
.badge-wd   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.badge-both { background: var(--text); color: var(--bg); }

.l3item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--border); cursor: pointer;
}
.l3item:hover { background: var(--hover-bg); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.l3item:hover .l3lbl { color: var(--hover-txt); }
.l3item:last-child { border-bottom: none; }
.l3item.hilit { background: var(--faint); }
.l3lbl { font-size: 11px; color: var(--body); font-family: var(--font-body); flex: 1; font-weight: 200; }

.dsec { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.dsec:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.dsec-t { font-size: 8.5px; font-weight: 700; letter-spacing: .1em; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; }
.dsec-b { font-size: 11px; color: var(--body); font-family: var(--font-body); font-weight: 200; line-height: 1.5; }
.dsec-obj { font-style: italic; color: var(--muted); }

.dback {
  font-size: 10px; font-weight: 600; color: var(--dim);
  letter-spacing: .06em; cursor: pointer; padding: 6px 0 10px; display: block;
}
.dback:hover { color: var(--text); }

.dcheck {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 5px 0; border-bottom: 1px solid var(--border);
  font-size: 10.5px; color: var(--body);
  font-family: var(--font-body); font-weight: 200; line-height: 1.45;
}
.dcheck:last-child { border-bottom: none; }
.dcheck-box { width: 10px; height: 10px; border: 1px solid var(--border); border-radius: 2px; flex-shrink: 0; margin-top: 2px; }

.dcl { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.dcl:hover { background: var(--hover-bg); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.dcl:last-child { border-bottom: none; }
.dcl-ext { cursor: default; }
.dclbullet { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; margin-top: 4px; }
.dcl-ext .dclbullet { background: var(--red); }
.dcltxt { flex: 1; font-size: 11px; color: var(--body); font-family: var(--font-body); font-weight: 200; }
.dcltxt strong { font-weight: 600; color: var(--text); font-family: var(--font-head); }
.dcl-tag { font-size: 8px; font-weight: 700; letter-spacing: .05em; padding: 1px 5px; border-radius: 2px; margin-left: 5px; vertical-align: middle; }
.dcl-tag.ext { background: var(--red); color: #fff; }
.dcl-tag.int { background: var(--border); color: var(--dim); }
.dcl-nav { font-size: 9px; color: var(--dim); margin-top: 2px; }
.dcl-open { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--red); border: 1px solid var(--red); padding: 2px 8px; border-radius: 2px; cursor: pointer; }
.dcl-open:hover { background: var(--red); color: #fff; }
.dsrc { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--dim); border: 1px solid var(--border); padding: 2px 8px; border-radius: 2px; display: inline-block; }
.kw-chip { font-size: 9px; font-weight: 600; letter-spacing: .05em; color: var(--dim); border: 1px solid var(--border); padding: 2px 8px; border-radius: 2px; }
.iso-back { display: flex; gap: 8px; padding-bottom: 10px; }
.iso-back button { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: var(--font-head); font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 5px; cursor: pointer; border-radius: 2px; }
.iso-back button:hover { background: var(--hover-bg); color: var(--hover-txt); border-color: var(--hover-bg); }
.iso-back button.primary { border-color: var(--text); color: var(--text); }
.empty-note { font-size: 10px; color: var(--dim); font-family: var(--font-body); font-weight: 200; font-style: italic; }

/* ── L3 CALLOUT OVERLAY (adjacent to right panel) ─────── */
#l3-callout {
  position: absolute; top: 60px; right: 296px;
  min-width: 180px; max-width: 240px;
  background: var(--bg); border: 1px solid var(--text);
  border-radius: 2px; padding: 10px 12px;
  z-index: 30; transition: opacity .12s;
}
#l3-callout.hidden { opacity: 0; pointer-events: none; }
#l3-callout.pinned { border-color: var(--text); }
.co-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.co-badge  { font-size: 8px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 2px; flex-shrink: 0; }
.co-badge-tp   { background: var(--text); color: var(--bg); }
.co-badge-wd   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.co-badge-both { background: var(--text); color: var(--bg); }
.co-label { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.3; }
.co-ref   { font-size: 9px; color: var(--dim); font-family: var(--font-body); font-weight: 200; letter-spacing: .03em; margin-bottom: 5px; }
.co-obj   { font-size: 10px; color: var(--body); font-family: var(--font-body); font-weight: 200; line-height: 1.45; font-style: italic; }

/* ── SVG ELEMENT STATES ──────────────────────────────────── */
.l1g { cursor: pointer; }
.l1g.faded .l1circ { opacity: 0.15; }
.l1g.faded text    { opacity: 0.15; }
.l1g.dim           { opacity: 0.12; }
.l1g.xtarget .l1circ { stroke: var(--red) !important; stroke-width: 2 !important; }

.l2g { cursor: pointer; opacity: 0; transition: opacity .18s; }
.l2g.vis           { opacity: 1; }
.l2g.sel .l2circ   { fill: var(--hover-bg) !important; stroke: var(--hover-bg) !important; }
.l2g.sel .l2lbl    { fill: #000000 !important; }
.l2g.dim           { opacity: 0.12; }
.l2g.xtarget .l2circ { stroke: var(--red) !important; stroke-width: 2 !important; }

.l2line { opacity: 0; }
.l2line.vis        { opacity: 1; }
.l2line.l2line-sel { stroke: var(--text) !important; stroke-dasharray: none !important; stroke-width: 1.5 !important; opacity: 1; }
.l2line.xred       { stroke: var(--red) !important; opacity: 1; }

.l3g { cursor: pointer; opacity: 0; transition: opacity .15s; }
.l3g.vis           { opacity: 1; }
.l3g.sel .l3anchor { fill: var(--hover-bg) !important; stroke: var(--hover-bg) !important; }
.l3g.dim           { opacity: 0.12; }
.l3g.topic .l3anchor { stroke: var(--text) !important; stroke-width: 2; }
.l3g.iso-src .l3anchor { fill: var(--red) !important; stroke: var(--red) !important; }
.l3g.iso-tgt .l3anchor { fill: transparent !important; stroke: var(--red) !important; stroke-width: 2; }

.l3line { opacity: 0; }
.l3line.vis  { opacity: 1; }
.l3line.xred { stroke: var(--red) !important; opacity: 1; stroke-width: 1.2 !important; }

.connpath { opacity: 0; pointer-events: none; }
.connpath.vis { opacity: 1; pointer-events: all; }

.xplus { cursor: pointer; }
.xplus circle { transition: fill .15s; }
.xplus:hover circle { fill: var(--red); }

.backbtn { cursor: pointer; opacity: 0; pointer-events: none; }
.backbtn.vis { opacity: 1; pointer-events: all; }

.center-g { transition: opacity .2s; }
.center-g.hidden { opacity: 0; pointer-events: none; }

/* iso-hide: fully hides unrelated nodes in isolated view */
.iso-hide { opacity: 0 !important; pointer-events: none !important; }

/* l3 persistent labels -- visible when parent l3g has .vis */
.l3g .l3-lbl { opacity: 0; transition: opacity .15s; }
.l3g.vis .l3-lbl { opacity: 1; }
.l3g.sel .l3-lbl { fill: var(--hover-bg) !important; }
</style>
</head>
<body>
<div id="app">
  <div id="graph">

    <!-- Toolbar -->
    <div id="toolbar">
      <button id="idx-btn">INDEX</button>
      <div class="hdiv"></div>
      <div id="srch-wrap">
        <input id="srch" type="text" placeholder="Search elements…" autocomplete="off">
        <div id="sr-drop"></div>
      </div>
      <div class="hdiv"></div>
      <button class="mbtn on" data-m="browse">Browse</button>
      <button class="mbtn" data-m="connect">Connections</button>
      <div class="hdiv"></div>
      <button class="fbtn on" data-f="all">All</button>
      <button class="fbtn" data-f="TP">TP</button>
      <button class="fbtn" data-f="WD">WD</button>
      <div class="hdiv"></div>
      <button class="zbtn" id="zin">+</button>
      <button class="zbtn" id="zout">−</button>
      <button class="zbtn" id="fitbtn" style="width:auto;padding:0 8px;font-size:10px;letter-spacing:.06em">FIT</button>
    </div>

    <!-- L3 callout overlay (Option A) -->
    <div id="l3-callout" class="hidden"></div>

    <!-- Hint -->
    <div id="hint">Click a category · Scroll to zoom · Drag to pan</div>

    <!-- Left index panel -->
    <div id="idx-panel">
      <div id="idx-list"></div>
    </div>

    <!-- Right detail panel -->
    <div id="panel">
      <div id="panel-head">
        <div id="ppath"></div>
        <div id="ptitle"></div>
      </div>
      <div id="pbody"></div>
      <button id="sugbtn">+ Suggest an addition</button>
    </div>

  </div>
</div>

<!-- Data -->
<script src="src/d3.min.js"></script>
<script src="src/kb-data.js"></script>

<!-- Modules (load order = dependency order) -->


<script src="src/module-core.js"></script>
<script src="src/module-decor.js"></script>
<script src="src/module-l1.js"></script>
<script src="src/module-l2.js"></script>
<script src="src/module-l3.js"></script>
<script src="src/module-connections.js"></script>
<script src="src/module-viewport.js"></script>
<script src="src/module-callout.js"></script>
<script src="src/module-panel.js"></script>
<script src="src/module-index.js"></script>
<script src="src/module-search.js"></script>
<script src="src/module-state.js"></script>

</body>
</html>
